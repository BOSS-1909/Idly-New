name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Godot Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Debug-Keystore für Godot einrichten
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export-Vorlagen an richtigen Ort kopieren
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.2.1.stable ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/4.2.1.stable

      - name: APK exportieren (Debug)
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/idle-rpg.apk --verbose

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: idle-rpg-apk
          path: build/idle-rpg.apk
